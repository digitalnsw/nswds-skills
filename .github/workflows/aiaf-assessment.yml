name: AIAF assessment skill tests
on:
  pull_request:
    paths:
      - 'skills/aiaf-assessment/**'
      - '.github/workflows/aiaf-assessment.yml'
  push:
    branches: [main]
    paths:
      - 'skills/aiaf-assessment/**'
      - '.github/workflows/aiaf-assessment.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - run: python3 -m unittest discover -s skills/aiaf-assessment/scripts -v
