name: WCAG technical audit tests
on:
  pull_request:
    paths:
      - 'skills/wcag-technical-audit/**'
      - '.github/workflows/wcag-technical-audit.yml'
  push:
    branches: [main]
    paths:
      - 'skills/wcag-technical-audit/**'
      - '.github/workflows/wcag-technical-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test skills/wcag-technical-audit/scripts/coverage.test.mjs
