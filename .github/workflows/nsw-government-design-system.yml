name: NSW Government Design System skill tests
on:
  pull_request:
    paths:
      - 'skills/nsw-government-design-system/**'
      - '.github/workflows/nsw-government-design-system.yml'
  push:
    branches: [main]
    paths:
      - 'skills/nsw-government-design-system/**'
      - '.github/workflows/nsw-government-design-system.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test skills/nsw-government-design-system/scripts/nswds.test.mjs
